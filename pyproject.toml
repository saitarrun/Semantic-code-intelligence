[project]
name = "semantic-code-intelligence"
version = "0.1.0"
description = "Local-first Semantic Code Intelligence Platform with FAISS, BM25, and Cross-Encoder Reranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.9.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "rank-bm25>=0.2.2",
    "rich>=13.9.0",
    "sentence-transformers>=3.3.0",
    "tabulate>=0.9.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
    "watchdog>=4.0.0",
]

[project.scripts]
code-intel = "semantic_code_intel.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semantic_code_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
